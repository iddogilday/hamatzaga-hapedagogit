<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המצגת הפדגוגית</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- These two libraries are only used by the admin's Excel/CSV import screen, not by the login
     screen or most of the app - but as plain blocking <script> tags in <head>, the browser must
     fully download and run BOTH (xlsx.full.min.js in particular is a large file) before it can
     even start showing the login form, which on a slow phone connection can look like the app
     "isn't opening" for several seconds. "defer" lets the page download and render immediately in
     parallel, while these still finish loading before any script that might need them runs. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --paper:#EFEEE8;
    --card:#FFFFFF;
    --ink:#22261F;
    --ink-soft:#63685E;
    --pine:#2F4538;
    --pine-dark:#1D2B22;
    --pine-light:#3E5A48;
    --brass:#C9A227;
    --brass-light:#E4C866;
    --border:#DCD8CC;
    --purple:#7C5CBF;
    --green:#4C9A6A;
    --yellow:#D9A62E;
    --red:#C7573F;
    --grey:#B7B3A6;
    --shadow: 0 1px 2px rgba(34,38,31,.06), 0 4px 14px rgba(34,38,31,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Heebo', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    direction:rtl;
  }
  h1,h2,h3,h4{font-weight:800; margin:0 0 .3em 0; letter-spacing:-.01em;}
  p{margin:0 0 .6em 0;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:.65em 1.1em;
    font-size:.95rem;
    font-weight:700;
    transition:transform .08s ease, background .15s ease;
  }
  button:active{transform:scale(.97);}
  .btn-primary{background:var(--pine); color:#fff;}
  .btn-primary:hover{background:var(--pine-light);}
  .btn-ghost{background:transparent; color:var(--pine); border:1.5px solid var(--pine);}
  .btn-ghost:hover{background:var(--pine); color:#fff;}
  .btn-danger{background:transparent; color:var(--red); border:1.5px solid var(--red); padding:.4em .8em; font-size:.85rem;}
  .btn-danger:hover{background:var(--red); color:#fff;}
  input, select, textarea{
    font-family:inherit;
    font-size:.95rem;
    padding:.6em .7em;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);}
  label{display:block; font-size:.85rem; font-weight:500; color:var(--ink-soft); margin-bottom:1em;}
  label > span{display:block; margin-bottom:.35em;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
    background:linear-gradient(120deg, #1e2f5c 0%, #3a2a6b 28%, #7a2f6b 55%, #b8443f 78%, #d9862f 100%);
  }
  .login-wrap::before, .login-wrap::after{
    content:''; position:absolute; border-radius:50%; filter:blur(60px); opacity:.55; pointer-events:none;
  }
  .login-wrap::before{
    width:480px; height:480px; top:-160px; right:-140px;
    background:radial-gradient(circle, rgba(255,196,102,.85), transparent 70%);
  }
  .login-wrap::after{
    width:420px; height:420px; bottom:-140px; left:-120px;
    background:radial-gradient(circle, rgba(100,180,255,.55), transparent 70%);
  }
  .login-card{
    position:relative; z-index:1;
    background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.5); border-radius:22px;
    box-shadow:0 20px 60px rgba(20,10,40,.35); padding:2.6em 2.2em; width:100%; max-width:380px; text-align:center;
    border-top:6px solid transparent;
    background-image:
      linear-gradient(rgba(255,255,255,.92), rgba(255,255,255,.92)),
      linear-gradient(90deg, #d9862f, #b8443f, #7a2f6b, #3a2a6b);
    background-origin:border-box; background-clip:padding-box, border-box;
  }
  .brandmark{font-size:2.9rem; margin-bottom:.15em; filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));}
  .login-card h1{
    font-size:1.9rem; font-weight:800; margin-bottom:.15em;
    background:linear-gradient(90deg, #3a2a6b, #b8443f, #d9862f);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--pine-dark);
  }
  .tagline{color:var(--ink-soft); font-size:.9rem; margin-bottom:1.6em;}
  .login-card form{text-align:right;}
  .login-card button{
    width:100%; margin-top:.4em; padding:.8em; border:none; border-radius:10px; font-weight:700;
    background:linear-gradient(90deg, #d9862f, #b8443f 55%, #7a2f6b); color:#fff;
    box-shadow:0 8px 20px rgba(184,68,63,.35); transition:transform .15s ease, box-shadow .15s ease;
  }
  .login-card button:hover{ transform:translateY(-1px); box-shadow:0 12px 26px rgba(184,68,63,.45); }
  .hint{margin-top:1.2em; font-size:.78rem; color:var(--ink-soft); background:rgba(58,42,107,.06); border-radius:10px; padding:.6em;}
  .error-box{color:var(--red); font-size:.85rem; margin-top:.8em; font-weight:600;}

  /* ---------- Shell ---------- */
  .topbar{
    background:var(--pine); color:#fff; display:flex; align-items:center;
    justify-content:space-between; padding:.8em 1.4em; flex-wrap:wrap; gap:.6em;
    border-bottom:3px solid var(--brass);
  }
  .brand{font-weight:800; font-size:1.15rem; display:flex; align-items:center; gap:.4em;}
  .tabs{display:flex; gap:.3em; flex-wrap:wrap;}
  .tabs button{
    background:transparent; color:#E7E4D8; font-weight:600; font-size:.88rem;
    padding:.5em .9em; border-radius:8px 8px 0 0;
  }
  .tabs button.active{background:var(--paper); color:var(--pine-dark);}
  .tabs button:hover:not(.active){background:rgba(255,255,255,.12);}
  .userbox{display:flex; align-items:center; gap:.8em; font-size:.85rem; color:#E7E4D8;}
  .userbox button{background:rgba(255,255,255,.14); color:#fff; font-size:.8rem; padding:.4em .8em;}
  .userbox button:hover{background:rgba(255,255,255,.26);}
  .content{padding:1.6em; max-width:1900px; margin:0 auto;}
  .back-link{background:none; border:none; color:var(--pine); font-weight:700; padding:.3em 0; margin-bottom:1em; font-size:.9rem;}
  .back-link:hover{text-decoration:underline;}

  /* ---------- Cards / grids ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1em;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:1.1em 1.2em; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s;
  }
  .card:hover{border-color:var(--brass);}
  .card h3{font-size:1.05rem; margin-bottom:.2em; color:var(--pine-dark);}
  .card .meta{font-size:.82rem; color:var(--ink-soft);}
  .section{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:1.3em 1.4em; margin-bottom:1.3em; box-shadow:var(--shadow);
  }
  .section h2{font-size:1.15rem; color:var(--pine-dark); border-bottom:2px solid var(--paper); padding-bottom:.5em; margin-bottom:1em;}
  .empty-state{
    text-align:center; padding:2.4em 1em; color:var(--ink-soft); border:1.5px dashed var(--border); border-radius:12px;
  }

  /* ---------- Student rows ---------- */
  .student-row{
    display:flex; align-items:center; justify-content:space-between; gap:1em;
    padding:.8em .3em; border-bottom:1px solid var(--paper);
  }
  .student-row:last-child{border-bottom:none;}
  .student-name-link{background:none; border:none; font:inherit; font-weight:700; color:var(--pine-dark); cursor:pointer; padding:0; text-align:right;}
  .student-name-link:hover{text-decoration:underline;}
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--pine); color:#fff;
    display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.95rem; flex-shrink:0;
  }
  .avatar.lg{width:64px; height:64px; font-size:1.5rem;}
  .name-cell{display:flex; align-items:center; gap:.7em;}

  /* ---------- Color picker (subject teacher) ---------- */
  .color-picker{display:flex; gap:.5em;}
  .color-dot{
    width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:.9rem; font-weight:800;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .color-dot.selected{border-color:var(--pine-dark); box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--pine-dark);}
  .color-dot.empty{background:#fff; border:2px dashed var(--grey); color:var(--grey);}
  .c-purple{background:var(--purple);} .c-green{background:var(--green);}
  .c-yellow{background:var(--yellow);} .c-red{background:var(--red);}

  /* ---------- Badge (group status display) ---------- */
  .badge-grid{display:flex; flex-wrap:wrap; gap:.9em;}
  .badge{
    display:flex; flex-direction:column; align-items:center; gap:.4em; width:92px;
  }
  .badge .seal{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.5), var(--shadow);
    color:#fff; font-weight:800; font-size:1.1rem;
  }
  .badge .seal.none{background:#fff; border:2px dashed var(--grey); color:var(--grey); box-shadow:none;}
  .badge span.label{font-size:.78rem; text-align:center; color:var(--ink-soft); font-weight:600; line-height:1.2;}

  .subj-badge{
    position:relative; width:74px; height:74px; border-radius:50%; background:#fff;
    border:7px solid var(--grey); display:flex; align-items:center; justify-content:center;
    font-size:2rem; box-shadow:var(--shadow); flex-shrink:0;
  }
  .subj-badge.c-purple{border-color:var(--purple); background:#F3EEFB;}
  .subj-badge.c-green{border-color:var(--green); background:#E9F5EE;}
  .subj-badge.c-yellow{border-color:var(--yellow); background:#FCF3E0;}
  .subj-badge.c-red{border-color:var(--red); background:#FBEAE6;}
  .subj-badge .lvl{
    position:absolute; top:-8px; left:-8px; background:var(--pine); color:#fff;
    font-size:.72rem; font-weight:800; border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff;
  }

  /* ---------- Compact profile columns ---------- */
  /* Each column's width used to be flex-grow:1, which stretches every column - even a sparse one
     with just 2-3 icons - to share the leftover row width equally with a packed one. That leaves
     big empty gaps inside the sparse columns. Instead, columns size to fit their own content (a
     row of a few icons) and DON'T grow past that, so more (denser) columns fit per row and empty
     space is only left over at the very end of a row, not inside every column. */
  .profile-columns{ display:flex; flex-wrap:wrap; gap:.8em; align-items:flex-start; margin-bottom:1.3em; }
  .profile-col{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:.8em .9em; box-shadow:var(--shadow); flex:0 1 240px; max-width:240px; min-width:150px;
  }
  .profile-col.badges-col{ flex:0 1 320px; max-width:320px; min-width:190px; }
  .profile-col h3{ font-size:.88rem; color:var(--pine-dark); margin-bottom:.6em; border-bottom:2px solid var(--paper); padding-bottom:.4em; }
  .compact-row{ margin-bottom:.65em; }
  .compact-row:last-child{ margin-bottom:0; }
  .compact-row .clabel{ font-size:.7rem; color:var(--ink-soft); font-weight:600; margin-bottom:.3em; display:block; line-height:1.25; }
  .compact-row .color-picker{ gap:.25em; flex-wrap:wrap; }
  .compact-row .color-dot{ width:22px; height:22px; font-size:.65rem; }
  .compact-row select{ font-size:.74rem; padding:.35em .4em; }
  .compact-row input[type="number"]{ font-size:.78rem; padding:.35em .4em; width:50px !important; }
  .badges-col .badge-grid{ gap:.7em; }

  /* ---------- Faculty-meeting presentation: fills the whole screen, scaled to fit exactly -------
     How much a student actually has (3 groups vs. 12, a note or not) varies a lot, so a fixed icon
     size can never be "right" for everyone - too big and it overflows into a scrollbar, too small
     and it wastes the screen on a student with little data. So this block is drawn at one
     comfortable "natural" size below, and a small script (fitMliyaPage, near the presentation
     render function) measures it after every render and adjusts a single CSS "zoom" level on the
     whole block up or down until it fills the available screen exactly, edge to edge, with no
     scrollbar - like a slide that auto-fits its frame.
     zoom (not transform:scale) is used on purpose: transform only changes how a box is PAINTED,
     not how much room it reserves in the layout or how its flex-wrap children wrap, so a
     transform-scaled-down block still leaves its original, un-shrunk empty space behind it (blank
     margins) and the number of icons per row never changes. zoom actually resizes the box for
     layout purposes too, so shrinking it lets flex-wrap pack more icons per row and the block
     truly grows/shrinks to fill the screen instead of shrinking-in-place. ---------- */
  .mliya-page{ display:flex; flex-direction:column; height:calc(100vh - 8.5em); overflow:hidden; }
  /* Fallback only, for the rare case a student has so much data that even the minimum zoom level
     doesn't make it all fit - better a scrollbar than unreadably tiny icons. */
  .mliya-page .mliya-fit-wrap{ flex:1; min-height:0; overflow:auto; }
  .mliya-page .profile-columns{ gap:1.4em; margin-bottom:0; align-content:flex-start; justify-content:space-between; }
  .mliya-page .profile-col{ padding:1.1em 1.3em; flex:0 1 420px; max-width:420px; min-width:300px; }
  .mliya-page .profile-col.badges-col{ flex:0 1 600px; max-width:600px; min-width:380px; }
  .mliya-page .profile-col h3{ font-size:1.3rem; margin-bottom:.55em; padding-bottom:.3em; }
  .mliya-page .badge-grid{ gap:1.3em; justify-content:flex-start; }
  .mliya-page .badge{ width:150px; gap:.45em; }
  .mliya-page .subj-badge{ width:128px; height:128px; font-size:3.4rem; border-width:10px; }
  .mliya-page .badge span.label{ font-size:1rem; line-height:1.25; }
  .mliya-page .section{ padding:.8em 1.3em; margin-bottom:.6em; }
  .mliya-page .section h2{ font-size:1.15rem; margin-bottom:.4em; padding-bottom:.35em; }
  .mliya-page .section p{ font-size:1rem; margin:0; }

  /* ---------- Forms ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 1.4em;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  textarea{min-height:90px; resize:vertical; grid-column:1 / -1;}

  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th,td{text-align:right; padding:.6em .5em; border-bottom:1px solid var(--paper);}
  th{color:var(--ink-soft); font-weight:600;}
  /* Tables (users/classes lists) have more columns than a phone screen is wide - rather than
     squeezing the text unreadably small, let the table scroll sideways inside its own box while
     the rest of the page stays put. */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .table-scroll table{ min-width:480px; }

  /* ---------- Small screens (phones) ---------- */
  @media (max-width:600px){
    .content{ padding:1em .8em; }
    .login-card{ padding:1.8em 1.3em; }
    .topbar{ padding:.7em 1em; }
    .brand{ font-size:1.02rem; }
  }

  /* ---------- Faculty-meeting presentation: landscape only -----------
     This screen ("תצוגה למליאת המורים") is meant to be shown to a room, so on a phone it should
     only be viewed sideways (landscape) - everything else in the app should still work fine
     upright. Below a certain width, if the phone is held upright, we hide the presentation and
     show a "turn your phone sideways" prompt instead; rotating the phone brings it right back,
     no extra taps needed. */
  .rotate-prompt{ display:none; }
  @media (max-width:900px) and (orientation:portrait){
    .mliya-page{ display:none; }
    .rotate-prompt{
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
      gap:.7em; min-height:50vh; padding:3em 1.5em; color:var(--ink-soft);
    }
    .rotate-prompt .icon{ font-size:3rem; }
    .rotate-prompt h2{ color:var(--pine-dark); font-size:1.15rem; }
  }
  .stat-row{display:flex; gap:1.6em; flex-wrap:wrap; margin-bottom:1em;}
  .stat{background:var(--paper); border-radius:10px; padding:.8em 1.2em; text-align:center; min-width:100px;}
  .stat .num{font-size:1.5rem; font-weight:800; color:var(--pine-dark); display:block;}
  .stat .lbl{font-size:.78rem; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--pine-dark); color:#fff; padding:.7em 1.4em; border-radius:10px;
    font-weight:600; font-size:.9rem; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .csv-example{
    background:var(--paper); border-radius:8px; padding:.9em 1em; font-size:.78rem; overflow-x:auto;
    white-space:pre; font-family:monospace; color:var(--ink-soft); margin-bottom:1em; direction:ltr; text-align:left;
  }
  .inline-note{font-size:.8rem; color:var(--ink-soft); margin-top:.4em;}
  .role-pill{
    display:inline-block; font-size:.72rem; font-weight:700; padding:.2em .6em; border-radius:99px;
    background:var(--paper); color:var(--pine-dark); margin-inline-start:.4em;
  }
  .spinner{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:spin .7s linear infinite; margin-inline-end:.5em; vertical-align:-2px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== Constants ===================== */
  var COLOR_ORDER = ['purple','green','yellow','red'];
  var COLOR_LABEL = {purple:'סגול', green:'ירוק', yellow:'צהוב', red:'אדום'};
  var COLOR_CLASS = {purple:'c-purple', green:'c-green', yellow:'c-yellow', red:'c-red'};
  var COLOR_MEANING = {purple:'מצטיין', green:'טוב', yellow:'טעון שיפור', red:'לא טוב'};
  function colorTitle(c){ return c ? (COLOR_LABEL[c]+' — '+COLOR_MEANING[c]) : 'אין נתון'; }
  var ROLE_LABEL = {admin:'מנהל/ת מערכת', teacher:'מורה מקצועי/ת', homeroom:'מחנך/ת', manager:'הנהלה'};

  // Fixed domains a homeroom teacher manages. Each indicator has a "kind" that controls its input:
  //  'color'  - pick one of a restricted color set (item.colors)
  //  'flag'   - off (grey) / on (green) toggle, for neutral yes/no facts
  //  'select' - a fixed list of text options, no color
  //  'letter' - a fixed set of letters (א-ד), no color
  //  'number' - a running count; color is derived automatically (green/yellow/red)
  // Each option of the "parent status" dropdown carries its own icon (used both in the dropdown
  // itself and to represent the *selected* status wherever the item shows an icon instead of text).
  // "svg" is an original two-figure/three-figure pictogram (blue = involved with the child and
  // close by, red = not involved / distant) used for the badge/row icon; "icon" stays a plain
  // emoji because it's also used as literal text inside a <select><option>, which can't render HTML.
  var PARENT_STATUS_OPTIONS = [
    {value:'הורים נשואים', icon:'👨‍👩‍👧‍👦',
      svg:'<svg viewBox="0 0 24 24" width="{S}" height="{S}"><circle cx="6.8" cy="6.5" r="2.5" fill="#3D6FA6"/><path d="M3 22C3 15.2 4.4 12.2 6.8 12.2C9.2 12.2 10.6 15.2 10.6 22Z" fill="#3D6FA6"/><circle cx="17.2" cy="6.5" r="2.5" fill="#3D6FA6"/><path d="M13.4 22C13.4 15.2 14.8 12.2 17.2 12.2C19.6 12.2 21 15.2 21 22Z" fill="#3D6FA6"/><circle cx="12" cy="13" r="1.7" fill="#3D6FA6"/><path d="M9.4 22C9.4 17.7 10.3 16 12 16C13.7 16 14.6 17.7 14.6 22Z" fill="#3D6FA6"/></svg>'},
    {value:'הורים גרושים - רק אמא מעורבת', icon:'👩‍👧',

  // The row/badge icon for an indicator: for the parent-status dropdown it's the SELECTED
  // status's own (emoji) icon, so it actually describes the current status; for anything else
  // it's a real photo if the school supplied one for this indicator (DOMAIN_IMAGE), otherwise
  // the item's fixed vector icon.
  function renderItemIcon(item, rec, size){
    if(item.kind==='select'){
      var opt = (item.options||[]).find(function(o){ return o.value===rec.value; });
      if(opt){
        if(opt.svg) return opt.svg.replace(/\{S\}/g, size);
        return '<span style="font-size:'+Math.round(size*0.8)+'px; line-height:1;">'+opt.icon+'</span>';
      }
      return domainIconHtml(item, size) || iconSvg(item.icon, size);
    }
    return domainIconHtml(item, size) || iconSvg(item.icon, size);
  }
  function domainIconHtml(item, size){
    var img = DOMAIN_IMAGE[item.label];
    if(!img) return null;
    return '<img src="'+img+'" style="width:'+size+'px; height:'+size+'px; object-fit:cover; border-radius:50%;">';
  }
  var DOMAIN_ORDER = ['social','behavior','emotional'];
  function countColor(n){ n = n||0; if(n<=2) return 'green'; if(n<=5) return 'yellow'; return 'red'; }
  function indKey(domainKey, label){ return domainKey+'|'+label; }

  function baseSubjectName(name){
    return String(name||'').replace(/\s*\d+\s*יח[״"'`]*ל?\s*$/,'').replace(/\s+\d+\s*$/,'').trim();
  }
  function extractLevelUnits(name){
    var m = String(name||'').match(/(\d+)\s*יח/);
    return m ? parseInt(m[1],10) : null;
  }
  // A group's classesLabel is the raw list of feeding classes as parsed from the Excel header,
  // e.g. 'י"א 2, י"א 7' (grade + section, sometimes with a quote mark between the grade's two
  // letters). These two helpers turn that into (a) a single grade string to sort groups by, and
  // (b) a compact display string grouped by grade, e.g. "יא' 2,7".
  function parseClassToken(token){
    var t = String(token||'').replace(/["׳״']/g,'').trim(); // strip the quote mark, if any
    var m = t.match(/^([א-ת]{1,2})\s*(\d+)$/);

  /* ===================== Storage helpers (Google Sheets / Apps Script backend) =====================
     Google Apps Script Web Apps have unreliable CORS behavior for plain fetch() from third-party pages
     (the /exec URL redirects to script.googleusercontent.com, and that redirected response often fails
     browser CORS checks even though the same URL works fine when navigated to directly). We work around
     this with two well-established techniques:
       - Reads (doGet): loaded via a <script> tag (JSONP) instead of fetch — <script> tags are not subject
         to CORS at all, so this is fully reliable regardless of where the HTML file is hosted.
       - Writes (doPost): sent via fetch() in 'no-cors' mode. The browser still delivers the POST body to
         the server and Apps Script executes the write; we just can't read a confirmation response back
         (the response is "opaque"), so success is assumed unless the network request itself fails. */
  var jsonpCounter = 0;
  function jsonpRequest(url, params){
    return new Promise(function(resolve, reject){
      var cbName = 'matzpen_cb_' + (jsonpCounter++) + '_' + Date.now();
      var script = document.createElement('script');
      var timeoutId = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 15000);
      function cleanup(){
        clearTimeout(timeoutId);
        try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
        if(script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function(data){ cleanup(); resolve(data); };
      var qs = Object.keys(params||{}).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
      script.src = url + (url.indexOf('?')===-1?'?':'&') + (qs?qs+'&':'') + 'callback=' + cbName;
      script.onerror = function(){ cleanup(); reject(new Error('script load error')); };
      document.head.appendChild(script);
    });
  }
  function delay(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  var RETRY_ATTEMPTS = 5; // every read/write auto-retries up to this many times before giving up
  async function apiGetRaw(apiUrl, key){
    // Distinguishes a real connection failure ({ok:false}) from a successful call whose
    // key simply doesn't exist yet ({ok:true, value:null}) - these need different handling
    // (e.g. "can't reach the registry" vs. "this school code is new"). Google Apps Script Web
    // Apps are occasionally flaky (a cold start, a dropped JSONP callback) so each read is
    // retried automatically up to RETRY_ATTEMPTS times before it's reported as failed.
    for(var attempt=1; attempt<=RETRY_ATTEMPTS; attempt++){
      try{
        var data = await jsonpRequest(apiUrl, {key:key});
        if(data && data.success){
          return {ok:true, value: (data.value!=null && data.value!=='') ? data.value : null};
        }
      }catch(e){
        console.error('apiGetRaw attempt '+attempt+' failed', key, e);
      }
      if(attempt<RETRY_ATTEMPTS) await delay(300*attempt);
    }
    return {ok:false};
  }
  async function apiGet(apiUrl, key, fallback){

  // calls "in parallel" from the browser doesn't avoid paying that cost many times over - a single
  // batched call does. Falls back automatically to nothing (caller applies fallbacks) if the whole
  // batch request fails; a key simply missing from the sheet comes back as null, same as apiGet.
  async function apiGetBatchRaw(apiUrl, keys){
    for(var attempt=1; attempt<=RETRY_ATTEMPTS; attempt++){
      try{
        var data = await jsonpRequest(apiUrl, {keys: keys.join(',')});
        if(data && data.success){ return {ok:true, values: data.values||{}}; }
      }catch(e){

      }

    }

  // silently keep "assuming success" while the data never actually lands. So we check the size
  // ourselves BEFORE sending, and refuse with a clear, visible error instead of a silent no-op.
  var CELL_SAFE_LIMIT = 45000; // a safety margin under the real 50,000-char cap

    var body = JSON.stringify({key:key, value: JSON.stringify(value)});
    if(body.length > CELL_SAFE_LIMIT){
      console.error('apiSet: payload too large for key "'+key+'" ('+body.length+' chars)');
      showToast('שגיאה: כמות הנתונים גדולה מדי לשמירה בבת אחת. פנו לתמיכה.');

        console.error('apiSet attempt '+attempt+' failed', key, e);
        if(attempt<RETRY_ATTEMPTS) await delay(300*attempt);
      }
    }
    return false;
  }

  // (more grades/classes/groups/students), that blob can silently cross Google Sheets' 50,000-
  // char cell limit - and because writes are a fire-and-forget no-cors fetch() (see apiSet), a
  // write that got rejected for being too large looked exactly like a successful save: no error,

  //
  // The groups list alone turned out to still be big enough to hit the limit for a multi-grade

  // shards by a simple hash of each group's id - spreading the same groups across several cells
  // instead of one, with no dependency on how many grades/subjects actually exist.
  var ROSTER_GROUP_SHARDS = 6;

  function applySchoolDataValues(values){

        '<button type="button" class="back-link" id="forgotLinkBtn" style="margin-top:.6em;">שכחת סיסמה?</button>' +
        '<div class="hint">בית ספר חדש? הזינו קוד בית ספר שטרם נמצא, ושם משתמש+סיסמה משלכם - המערכת תדריך אתכם בהקמת מאגר נתונים משלכם ב-Google Sheets, ותיצור לכם אוטומטית חשבון Admin ראשון.</div>' +
      '</div></div>';
    document.getElementById('forgotLinkBtn').addEventListener('click', function(){ forgotPasswordMode = true; render(); });
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var code = slugify(fd.get('schoolCode'));
      var u = normalizeUsernameInput(fd.get('username'));
      var p = String(fd.get('password')||'');
      var errEl = document.getElementById('loginError');
      var btn = document.getElementById('loginSubmitBtn');
      if(!code){ errEl.textContent = 'יש להזין קוד בית ספר.'; return; }
      errEl.textContent = '';
      setBtnBusy(btn, true, 'מתחבר, נא להמתין…');
      // TEMPORARY diagnostic (safe to ignore/remove) - times each phase of login so we can see
      // exactly which network step is slow, instead of guessing.
      var __tStart = performance.now();
      var __tMark = function(label){ return {label:label, t:performance.now()-__tStart}; };
      var __marks = [];

      // The school's Sheet URL rarely changes once set, so we remember it locally (per school
      // code) and try it directly first - skipping the registry round-trip entirely on repeat
      // logins from this browser. If that cached URL turns out to be stale/wrong, we fall back
      // to a normal registry lookup automatically.
      var cachedApiUrl = null;
      try{ cachedApiUrl = localStorage.getItem(registryCacheKey(code)); }catch(e){}

      // 'users' (for auth) and the whole roster/statusColors bundle live under different keys in
      // the same sheet and don't depend on each other - and, more importantly, folding them all
      // into ONE batched call (instead of firing several calls "in parallel") means paying the
      // Apps Script backend's per-call startup cost only once instead of once per key.
      var loginBatchKeys = ['users'].concat(schoolDataBatchKeys());
      var batchResult;
      if(cachedApiUrl){
        schoolApiUrl = cachedApiUrl;
        batchResult = await apiGetBatchRaw(schoolApiUrl, loginBatchKeys);
        __marks.push(__tMark('כל נתוני הכניסה (כתובת שמורה)'));
      }
      if(!cachedApiUrl || !batchResult.ok){
        var regResult = await apiGetRaw(REGISTRY_API_URL, code);
        __marks.push(__tMark('מרשם בתי ספר'));
        if(!regResult.ok){
          setBtnBusy(btn, false, 'כניסה');
          errEl.textContent = 'לא הצלחנו להתחבר למרשם בתי הספר. בדקו חיבור לאינטרנט ונסו שוב.';
          return;
        }
        if(regResult.value === null){
          // Brand new school code: walk the admin through setting up their own sheet.
          pendingNewSchool = {code:code, username:u, password:p};
          render();
          return;
        }
        schoolApiUrl = JSON.parse(regResult.value);
        batchResult = await apiGetBatchRaw(schoolApiUrl, loginBatchKeys);
        __marks.push(__tMark('כל נתוני הכניסה (אחרי מרשם)'));
        if(!batchResult.ok){
          setBtnBusy(btn, false, 'כניסה');
          errEl.textContent = 'קוד בית הספר נמצא, אך לא הצלחנו להתחבר לגיליון הנתונים שלו. נסו שוב.';
          return;
        }
      }
      try{ localStorage.setItem(registryCacheKey(code), schoolApiUrl); }catch(e){}

      var usersRaw = batchResult.values['users'];
      var schoolUsers = usersRaw ? parseRawValue(usersRaw, []) : [];
      var match = (schoolUsers||[]).find(function(x){ return x.username===u && x.password===p; });
      if(match){
        currentSchool = code;
        users = schoolUsers;
        currentUser = match;
        var parsedSchoolData = applySchoolDataValues(batchResult.values);
        await loadLegacyRosterFallback(parsedSchoolData.classes, parsedSchoolData.groups, parsedSchoolData.students);
        __marks.push(__tMark('סה"כ'));
        var __summary = 'זמני התחברות (אבחון זמני): ' + __marks.map(function(m){ return m.label+': '+m.t.toFixed(0)+' מ"ש'; }).join(' | ');
        try{ console.log(__summary); window.__loginTimingLog = __marks; }catch(e){}
        pendingTimingBanner = __summary; // shown once, as a dismissible banner, right after the app screen renders
        afterLoginSuccess();
      }else{
        setBtnBusy(btn, false, 'כניסה');
        errEl.textContent = 'שם משתמש או סיסמה שגויים.';
      }
    });
  }

    if(roles.indexOf('admin')!==-1) return {screen:'browse_pick'};
    if(roles.indexOf('homeroom')!==-1) return {screen:'homeroom_classes'};

  /* ===================== Shell (topbar + tabs) ===================== */
  function tabsForSingleRole(role){
    if(role==='admin') return [
      ['admin_users','ניהול משתמשים'],
      ['admin_roster','טבלת תלמידים'],
      ['browse_pick','עיון בכל התלמידים']
    ];
    if(role==='teacher') return [['teacher_groups','הקבוצות שלי']];
    if(role==='homeroom') return [['homeroom_classes','הכיתה שלי']];
    return [['browse_pick','כל התלמידים']];
  }
  function tabsForRoles(roles){
    roles = roles || [];
    var seen = {}, tabs = [];
    ROLE_PRIORITY.forEach(function(r){
      if(roles.indexOf(r)===-1) return;
      tabsForSingleRole(r).forEach(function(t){
        if(!seen[t[0]]){ seen[t[0]]=true; tabs.push(t); }
      });
    });
    if(!tabs.length) tabs = tabsForSingleRole('manager');
    return tabs;
  }

  function renderShell(){
    var tabs = tabsForRoles(currentUser.roles);
    var activeTop = view.screen.split('_')[0] + '_' + (view.screen.split('_')[1]||'');
    var tabsHtml = tabs.map(function(t){
      var isActive = view.screen===t[0] || (t[0]==='browse_pick' && view.screen.indexOf('browse')===0) ||
                     (t[0]==='teacher_groups' && view.screen.indexOf('teacher')===0) ||
                     (t[0]==='homeroom_classes' && view.screen.indexOf('homeroom')===0) ||
                     (t[0]==='admin_users' && view.screen==='admin_users') ||
                     (t[0]==='admin_roster' && view.screen==='admin_roster');
      return '<button data-nav="'+t[0]+'" class="'+(isActive?'active':'')+'">'+t[1]+'</button>';
    }).join('');

    // TEMPORARY diagnostic (safe to ignore/remove): a one-time dismissible banner showing how long
    // the login that just happened took, phase by phase - shown here (not a blocking alert/dialog)
    // so it can never get in the way of the app actually opening on any device/browser.
    var timingBannerHtml = pendingTimingBanner
      ? '<div style="background:#FFF6DD; border-bottom:2px solid var(--brass); color:var(--ink); padding:.6em 1em; font-size:.78rem; display:flex; justify-content:space-between; align-items:center; gap:1em;">' +
          '<span>'+esc(pendingTimingBanner)+'</span>' +
          '<button type="button" id="dismissTimingBanner" style="background:none; border:none; color:var(--ink-soft); font-weight:800; font-size:1rem; padding:0 .4em;">✕</button>' +

      : '';

    app.innerHTML =
      timingBannerHtml +
      '<div class="topbar">' +
        '<div class="brand">🎓 המצגת הפדגוגית</div>' +
        '<div class="tabs">'+tabsHtml+'</div>' +
        '<div class="userbox">שלום, '+esc(currentUser.name)+(currentUser.roles||[]).map(function(r){return '<span class="role-pill">'+ROLE_LABEL[r]+'</span>';}).join('')+'<button data-action="logout">יציאה</button></div>' +
      '</div>' +
      '<div class="content" id="content"></div>';

    if(pendingTimingBanner){
      var dismissBtn = document.getElementById('dismissTimingBanner');
      if(dismissBtn) dismissBtn.addEventListener('click', function(){ pendingTimingBanner = null; renderShell(); });
    }

    app.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){ adminEditingUsername = null; view = {screen:b.getAttribute('data-nav')}; render(); });
    });
    app.querySelector('[data-action="logout"]').addEventListener('click', function(){
      currentUser = null; currentSchool = null; schoolApiUrl = null; users = [];
      roster = {classes:[], groups:[], students:[]}; statusColors = {}; homeroomData = {};
      forgotPasswordMode = false;
      view = {screen:'login'}; render();
    });

    var content = document.getElementById('content');
    var screen = view.screen;
    if(screen==='admin_users') return renderAdminUsers(content);
    if(screen==='admin_roster') return renderAdminRoster(content);
    if(screen==='teacher_groups') return renderTeacherGroups(content);
    if(screen==='teacher_group_detail') return renderGroupDetail(content, view.groupId);
    if(screen==='homeroom_classes') return renderHomeroomClasses(content);

  function pickCol(row, candidates){
    var keys = Object.keys(row);
    for(var i=0;i<candidates.length;i++){
      for(var j=0;j<keys.length;j++){
        if(keys[j].trim().indexOf(candidates[i])!==-1) return row[keys[j]];
      }
    }
    return '';
  }

  function importRoster(rows){
    var newStudents=0, newClasses=0, newGroups=0;
    rows.forEach(function(row){
      var studentName = String(pickCol(row, ['שם תלמיד','תלמיד'])||'').trim();
      var className = String(pickCol(row, ['כיתת אם','כיתה'])||'').trim();
      var homeroomUser = String(pickCol(row, ['מחנך'])||'').trim();
      var groupName = String(pickCol(row, ['קבוצת לימוד','קבוצה'])||'').trim();
      var teacherUser = String(pickCol(row, ['מורה מקצועי','מורה'])||'').trim();
      if(!studentName || !className) return;

      var classId = 'class_'+slugify(className);
      var cls = findClass(classId);
      if(!cls){
        cls = {id:classId, name:className, homeroomTeacherUsername: homeroomUser||''};
        roster.classes.push(cls);
        newClasses++;
      }else if(homeroomUser){
        cls.homeroomTeacherUsername = homeroomUser;
      }

      var studentId = 'stu_'+slugify(className)+'_'+slugify(studentName);
      var stu = findStudent(studentId);
      if(!stu){
        stu = {id:studentId, name:studentName, classId:classId};
        roster.students.push(stu);
        newStudents++;
      }

      if(groupName){
        var groupId = 'group_csv_'+slugify(groupName)+'_'+slugify(className);
        var grp = findGroup(groupId);
        if(!grp){
          grp = {id:groupId, name:groupName, subjectTeacherUsername:teacherUser||'', subject:baseSubjectName(groupName), levelUnits:extractLevelUnits(groupName), studentIds:[]};
          roster.groups.push(grp);
          newGroups++;
        }else if(teacherUser){
          grp.subjectTeacherUsername = teacherUser;
        }
        if(grp.studentIds.indexOf(studentId)===-1) grp.studentIds.push(studentId);
      }
    });
    return {newStudents:newStudents, newClasses:newClasses, newGroups:newGroups};
  }

  /* ---- Import from a school-system "class/pupils/subjects" Excel export ----
     Layout: one header row holds, per group column, a multi-line string like
     "מורה, מקצוע,  י' 1 י' 2 (רמה: 4 יח``ל)\n<id>\n(מורה)\n4 יח"
     and an 'X' in each student's row marks membership in that group.
     Separate columns (usually at the end) hold: מין / כיתה / ת.ז. / שם התלמיד. */
  function uniqueUsername(base){
    var candidate = base || 'user';
    var n = 1;
    while(users.some(function(u){ return u.username===candidate; })){
      n++; candidate = base + n;
    }
    return candidate;
  }
  function ensureRoleUser(fullName, role, newUsersOut){
    var name = String(fullName||'').trim();
    if(!name) return '';
    var existing = users.find(function(u){ return u.name===name; });
    if(existing){
      existing.roles = existing.roles || [];
      if(existing.roles.indexOf(role)===-1) existing.roles.push(role);
      return existing.username;
    }
    var username = uniqueUsername(slugify(name) || role);
    var password = '1234';
    var user = {name:name, username:username, password:password, roles:[role]};
    users.push(user);
    newUsersOut.push(user);
    return username;
  }
  // Some real-world exported Excel files carry a stale/incorrect "!ref" (used-range) dimension
  // in their sheet metadata that under-reports the true extent of the data by a column or two.
  // SheetJS trusts that stored metadata when parsing, so it silently drops the last column(s) of
  // such a sheet (openpyxl and other readers that recompute the range from actual cell data don't
  // have this problem). To be safe, before parsing we recompute the sheet's true used-range
  // directly from its actual cell keys and overwrite "!ref" with the corrected value.
  function fixSheetRange(ws){
    var maxRow = -1, maxCol = -1, minRow = 0, minCol = 0, hasCells = false;
    Object.keys(ws).forEach(function(addr){
      if(addr.charAt(0) === '!') return; // skip meta keys like !ref, !merges, !cols, etc.
      var cell;
      try{ cell = XLSX.utils.decode_cell(addr); }catch(e){ return; }
      if(!cell) return;
      hasCells = true;
      if(cell.r > maxRow) maxRow = cell.r;
      if(cell.c > maxCol) maxCol = cell.c;
    });
    if(!hasCells) return;
    var trueRange = {s:{r:minRow, c:minCol}, e:{r:maxRow, c:maxCol}};
    var trueRef = XLSX.utils.encode_range(trueRange);
    if(ws['!ref'] !== trueRef){
      ws['!ref'] = trueRef;
    }
  }
  function parseGroupHeader(headerText){
    var firstLine = String(headerText||'').split('\n')[0];
    // Teacher + subject are always the first two comma-separated fields. Everything after the
    // second comma is "the rest" - the list of feeding classes, and (only for subjects that carry
    // יח"ל units) a trailing "(רמה: ...)" parenthetical. Previously the class list was only ever
    // captured when a "(רמה:" parenthetical was present, so any group WITHOUT a level annotation
    // lost its class list entirely (classesRaw stayed '') and fell back to a shared, empty
    // classListKey - collapsing many distinct groups (different teachers/classes, same subject)
    // onto a single groupId and silently overwriting each other's student rosters. Now the class
    // list is always parsed from "the rest", and the level (if any) is pulled out of it separately.
    var m = firstLine.match(/^([^,]+),\s*([^,]+),\s*(.*)$/);
    var teacherName='', subject='', rest='';
    if(m){ teacherName=m[1].trim(); subject=m[2].trim(); rest=m[3].trim(); }
    else{ subject = firstLine.trim(); }
    var levelMatch = rest.match(/\(רמה:\s*([^)]+)\)/);
    var level = levelMatch ? levelMatch[1].trim().replace(/``/g,'"') : '';
    var classesRaw = rest.replace(/\(רמה:[^)]*\)/,'').trim();
    var groupName = subject;
    if(level && /יח/.test(level)) groupName = subject + ' ' + level;
    // A grade is 1-2 Hebrew letters (ז/ח/ט/י for 7th-10th, then two-letter יא/יב for 11th/12th),
    // written with a quote mark either BETWEEN the two letters (י"א) or AFTER both of them (יא'),
    // depending on the school's own convention - so we strip all quote marks out first and match
    // on the bare letters+digits, rather than trying to anticipate where the quote sits.
    // Quote marks around the grade's two letters show up in real exports as a straight double-quote,
    // a Hebrew gershayim/geresh, OR a doubled backtick (`` ` `` `` ` ``) used as a gershayim substitute -
    // sometimes several conventions mixed in the very same file - so all of them are stripped before matching.
    var classTokensSrc = classesRaw.replace(/["׳״'`]/g,'');
    var classTokens = (classTokensSrc.match(/[א-ת]{1,2}\s*\d+/g) || []).map(function(t){ return t.replace(/\s+/g,' ').trim(); });
    var classesLabel = classTokens.join(', ');
    var classListKey = classTokens.map(function(t){ return t.replace(/\s+/g,''); }).sort().join('_');
    return {
      teacherName:teacherName, subject:subject, groupName:groupName,
      isHomeroom: subject.trim()==='חינוך',
      classesLabel:classesLabel, classListKey:classListKey
    };
  }
  function importFromMasterSheet(matrix){
    var newStudents=0, newClasses=0, newGroups=0;
    var newTeachers = [];
    if(!matrix || !matrix.length) return {newStudents:0,newClasses:0,newGroups:0,newTeachers:newTeachers};

    var headerRowIdx = -1, nameCol=-1, classCol=-1, idCol=-1, genderCol=-1;
    for(var r=0;r<matrix.length;r++){
      for(var c=0;c<matrix[r].length;c++){
        var v = String(matrix[r][c]||'').trim();
        if(v==='שם התלמיד'){ nameCol=c; headerRowIdx=r; }
        else if(v==='כיתה'){ classCol=c; }
        else if(v.indexOf('ת.ז')===0 || v==='תז'){ idCol=c; }
        else if(v==='מין'){ genderCol=c; }
      }
      if(nameCol!==-1) break;
    }
    if(headerRowIdx===-1) return {newStudents:0,newClasses:0,newGroups:0,newTeachers:newTeachers};

    var headerRow = matrix[headerRowIdx];
    var groupCols = [];
    for(var c2=1;c2<headerRow.length;c2++){
      if(c2===nameCol||c2===classCol||c2===idCol||c2===genderCol) continue;
      var headerVal = headerRow[c2];
      if(headerVal && String(headerVal).indexOf(',')!==-1){
        groupCols.push(c2);
      }
    }
    // Resolve each column: either a regular study group, or (if subject === "חינוך") a homeroom-teacher marker.
    // Group identity is normally subject + level + the set of feeding classes (NOT the teacher), so that
    // swapping the teacher of an existing section keeps its saved status colors. But the same subject+class
    // combo is sometimes taught in parallel by more than one teacher at once (e.g. חנ"ג split by gender, or
    // parallel ability-tier groups drawing on the same class list) - those are genuinely different groups
    // with different student rosters. Previously they all collapsed onto one id and overwrote each other,
    // which is why the group count came out far lower than expected. So: first find every column whose
    // base id (subject+classes only) is shared by more than one column in THIS file, and only for those,
    // fold the teacher's name into the id to tell them apart; columns with no collision keep the plain,
    // teacher-independent id as before.
    var parsedByCol = {}, baseIdCounts = {};
    groupCols.forEach(function(c3){
      var parsed = parseGroupHeader(headerRow[c3]);
      if(!parsed.groupName || parsed.isHomeroom) return;
      parsed.baseId = 'group_'+slugify(parsed.groupName)+'_'+slugify(parsed.classListKey||'x');
      parsedByCol[c3] = parsed;
      baseIdCounts[parsed.baseId] = (baseIdCounts[parsed.baseId]||0) + 1;
    });
    var colInfo = {};
    groupCols.forEach(function(c3){
      var parsed = parseGroupHeader(headerRow[c3]);
      if(!parsed.groupName) return;
      if(parsed.isHomeroom){
        var homeroomUsername = ensureRoleUser(parsed.teacherName, 'homeroom', newTeachers);
        colInfo[c3] = {type:'homeroom', username:homeroomUsername};
      }else{
        var teacherUsername = ensureRoleUser(parsed.teacherName, 'teacher', newTeachers);
        var p = parsedByCol[c3];
        var groupId = baseIdCounts[p.baseId] > 1 ? (p.baseId+'_'+slugify(p.teacherName||'x')) : p.baseId;
        var grp = findGroup(groupId);
        if(!grp){
          grp = {id:groupId, name:parsed.groupName, subjectTeacherUsername:teacherUsername, classesLabel:parsed.classesLabel, subject:parsed.subject, levelUnits:extractLevelUnits(parsed.groupName), studentIds:[]};
          roster.groups.push(grp);
          newGroups++;
        }else{
          // keep the group's teacher/class-label current, but never touch its saved colors
          grp.subjectTeacherUsername = teacherUsername;
          grp.classesLabel = parsed.classesLabel;
          grp.subject = parsed.subject;
          grp.levelUnits = extractLevelUnits(parsed.groupName);
        }
        colInfo[c3] = {type:'group', groupId:groupId};
        grp.studentIds = []; // full sync: rebuilt below from this file's X marks
      }
    });

    var seenClassIds = {};
    var seenStudentIds = {};
    for(var r2=headerRowIdx+1; r2<matrix.length; r2++){
      var row = matrix[r2];
      var studentName = String((nameCol!==-1 ? row[nameCol] : '')||'').trim();
      if(!studentName) continue;
      var className = String((classCol!==-1 ? row[classCol] : '')||'').trim();
      var idNum = String((idCol!==-1 ? row[idCol] : '')||'').trim();

      var classId = className ? 'class_'+slugify(className) : 'class_unassigned';
      var cls = findClass(classId);
      if(!cls){
        cls = {id:classId, name:className||'ללא שיוך', homeroomTeacherUsername:''};
        roster.classes.push(cls);
        newClasses++;
      }
      seenClassIds[classId] = true;

      var studentId = idNum ? 'stu_'+slugify(idNum) : 'stu_'+slugify(className)+'_'+slugify(studentName);
      var stu = findStudent(studentId);
      if(!stu){
        stu = {id:studentId, name:studentName, classId:classId};
        roster.students.push(stu);
        newStudents++;
      }
      seenStudentIds[studentId] = true;

      groupCols.forEach(function(c4){
        var mark = String(row[c4]||'').trim();
        if(!mark) return;
        var info = colInfo[c4];
        if(!info) return;
        if(info.type==='homeroom'){
          cls.homeroomTeacherUsername = info.username;
        }else{
          var grp2 = findGroup(info.groupId);
          if(grp2 && grp2.studentIds.indexOf(studentId)===-1) grp2.studentIds.push(studentId);
        }
      });
    }

    // Students who used to belong to one of the classes covered by this file, but no longer
    // appear in it at all, have left the school - remove them (and their data) entirely.
    var removedStudentIds = [];
    roster.students = roster.students.filter(function(s){
      if(seenClassIds[s.classId] && !seenStudentIds[s.id]){
        removedStudentIds.push(s.id);
        return false;
      }
      return true;
    });
    removedStudentIds.forEach(function(sid){
      roster.groups.forEach(function(g){
        var idx = g.studentIds.indexOf(sid);
        if(idx!==-1) g.studentIds.splice(idx,1);
      });
      // Each student's homeroom data lives under its own key now, so it's cleared individually
      // (fire-and-forget - the roster/users save already covers the important synchronous part).
      delete homeroomData[sid];
      delete homeroomDataLoaded[sid];
      apiSet(schoolApiUrl, hdKey(sid), null);
    });

    // Groups whose column wasn't present in this file, but all of whose feeding classes WERE
    // covered by it, no longer exist (e.g. a section was discontinued) - drop the group record.
    // The student-facing color is unaffected: it's keyed by subject/group name, not this id.
    var touchedGroupIds = {};
    Object.keys(colInfo).forEach(function(c){
      if(colInfo[c].type==='group') touchedGroupIds[colInfo[c].groupId] = true;
    });
    var removedGroups = 0;
    roster.groups = roster.groups.filter(function(g){
      if(touchedGroupIds[g.id]) return true;
      var tokens = (g.classesLabel||'').split(',').map(function(t){ return t.trim(); }).filter(Boolean);
      if(!tokens.length) return true; // no class info to judge by - leave it alone
      var allCoveredByThisFile = tokens.every(function(t){ return !!seenClassIds['class_'+slugify(t)]; });
      if(allCoveredByThisFile){ removedGroups++; return false; }
      return true;
    });

    return {newStudents:newStudents, newClasses:newClasses, newGroups:newGroups, newTeachers:newTeachers, removedStudents:removedStudentIds.length, removedGroups:removedGroups};
  }

      '<div class="section"><h2>לפי קבוצת לימוד</h2><div class="grid">' +
        (sortedGroups.length ? sortedGroups.map(function(g){
          var teacherName = userName(g.subjectTeacherUsername);

  // Shared builders used by both the homeroom data-entry screen and the faculty-meeting

  function buildGroupsColHtml(studentId, groups){

      (groups.length ? '<div class="badge-grid">' + groups.map(function(g){
        var color = statusColors[g.name+'::'+studentId];
        var subject = g.subject || baseSubjectName(g.name);
        var levelUnits = g.levelUnits || extractLevelUnits(g.name);
        var iconHtml = subjectIconHtml(subject);
        var showLevel = levelUnits && (subject==='מתמטיקה' || subject==='אנגלית');
        var frameClass = color ? COLOR_CLASS[color] : '';
        var titleText = g.name + (color ? ' — '+colorTitle(color) : ' — אין נתון');
        return '<div class="badge"><div class="subj-badge '+frameClass+'" title="'+esc(titleText)+'">' + iconHtml +
          (showLevel ? '<span class="lvl">'+levelUnits+'</span>' : '') +

  function buildDomainColsHtml(hd, editable){
    return DOMAIN_ORDER.map(function(dKey){
      var domain = DOMAINS[dKey];
      var rowsHtml = domain.items.map(function(item){
        var key = indKey(dKey, item.label);
        var rec = hd.indicators[key] || {};
        return renderIndicatorRow(key, item, rec, editable);
      }).join('');
      // Force "רגשי" (emotional) onto its own new row, below the others, instead of leaving it to
      // flex-wrap's own judgment - which (depending on screen width and how many columns came
      // before it) could otherwise land it out of sight, needing a scroll to notice it's there at
      // all. A zero-height, full-row-width spacer right before it always pushes it down to a new
      // line, wherever it happens to fall.
      var breakBefore = (dKey==='emotional') ? '<div style="flex-basis:100%; height:0;"></div>' : '';
      return breakBefore + '<div class="profile-col"><h3>'+domain.label+'</h3>'+rowsHtml+'</div>';
    }).join('');
  }
  // Presentation-mode variant: every indicator becomes an icon badge (colored circle, like the
  // subject badges), instead of a compact edit row - denser and reads well from across a room.
  function renderIndicatorBadge(item, rec){
    if(item.kind==='letter'){
      var val = rec.value;
      return '<div class="badge"><div class="subj-badge" style="font-weight:800; color:var(--ink);">'+(val?esc(val):'–')+'</div><span class="label">'+esc(item.label)+'</span></div>';
    }
    if(item.kind==='select'){
      if(!rec.value) return ''; // only show the relevant status, nothing when unset
      return '<div class="badge"><div class="subj-badge" title="'+esc(rec.value)+'">'+renderItemIcon(item, rec, 48)+'</div><span class="label">'+esc(rec.value)+'</span></div>';
    }
    var frameClass = '', countLabel = '';
    if(item.kind==='number'){
      var count = rec.count || 0;
      frameClass = COLOR_CLASS[countColor(count)];
      countLabel = '<span class="lvl">'+count+'</span>';
    }else if(item.kind==='flag'){
      frameClass = rec.on ? 'c-green' : '';
    }else{ // color
      frameClass = rec.color ? COLOR_CLASS[rec.color] : '';
    }
    return '<div class="badge"><div class="subj-badge '+frameClass+'">'+renderItemIcon(item, rec, 48)+countLabel+'</div><span class="label">'+esc(item.label)+'</span></div>';
  }
  function buildDomainColsHtmlPresentation(hd){
    return DOMAIN_ORDER.map(function(dKey){
      var domain = DOMAINS[dKey];
      var badges = domain.items.map(function(item){
        var key = indKey(dKey, item.label);
        var rec = hd.indicators[key] || {};
        return renderIndicatorBadge(item, rec);
      }).join('');
      // Same forced-new-row spacer as the editable profile view (see buildDomainColsHtml) - keeps
      // "רגשי" reliably visible together with the other domains instead of wrapping unpredictably.
      var breakBefore = (dKey==='emotional') ? '<div style="flex-basis:100%; height:0;"></div>' : '';
      return breakBefore + '<div class="profile-col badges-col"><h3>'+domain.label+'</h3><div class="badge-grid">'+badges+'</div></div>';
    }).join('');
  }
  // Resizes/crops an uploaded photo to a small square JPEG and shrinks quality until the
  // resulting data URL comfortably fits in a single Google Sheets cell (50,000-char limit).
  function compressImageToDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read error')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('image load error')); };
        img.onload = function(){
          var size = 220;
          var side = Math.min(img.width, img.height);
          var sx = (img.width-side)/2, sy = (img.height-side)/2;
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          var quality = 0.72;
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          var attempts = 0;
          while(dataUrl.length > 40000 && attempts < 8){
            if(quality > 0.3){ quality -= 0.12; }
            else{ size = Math.round(size*0.8); canvas.width=size; canvas.height=size; ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size); quality = 0.6; }
            dataUrl = canvas.toDataURL('image/jpeg', Math.max(quality,0.2));
            attempts++;
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // Prev/next controls for paging through the same ordered student list the profile was opened from.
  function navStudentButtons(){
    if(!view.cohortStudentIds || !view.cohortStudentIds.length) return '';
    var idx = view.studentIndex || 0;
    var hasPrev = idx > 0;
    var hasNext = idx < view.cohortStudentIds.length - 1;
    return '<div style="display:flex; gap:.5em; align-items:center;">' +
      '<button class="btn-ghost" id="prevStudentBtn" '+(hasPrev?'':'disabled')+' style="padding:.4em .8em;">‹ תלמיד קודם</button>' +
      '<span class="meta">'+(idx+1)+' / '+view.cohortStudentIds.length+'</span>' +
      '<button class="btn-ghost" id="nextStudentBtn" '+(hasNext?'':'disabled')+' style="padding:.4em .8em;">תלמיד הבא ›</button>' +
    '</div>';
  }
  function wireNavButtons(screenName){
    if(!view.cohortStudentIds || !view.cohortStudentIds.length) return;
    var prevBtn = document.getElementById('prevStudentBtn');
    var nextBtn = document.getElementById('nextStudentBtn');
    function goTo(newIndex){
      view = {
        screen:screenName, studentId:view.cohortStudentIds[newIndex], editable:view.editable,
        returnScreen:view.returnScreen, returnParam:view.returnParam,
        cohortStudentIds:view.cohortStudentIds, studentIndex:newIndex
      };
      render();
    }
    if(prevBtn) prevBtn.addEventListener('click', function(){ if(!prevBtn.disabled) goTo(view.studentIndex-1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ if(!nextBtn.disabled) goTo(view.studentIndex+1); });
    prefetchAdjacentStudents();
  }

  // The homeroom "data entry" screen (and the general read-only browse screen for admin/management).
  // For a homeroom teacher entering data (editable===true) the subject-color badges are left out on
  // purpose - they're shown together with everything else on the "presentation" screen instead.
  function renderStudentProfile(content, studentId, editable){
    var student = findStudent(studentId);
    if(!student){ content.innerHTML = '<div class="empty-state">התלמיד לא נמצא.</div>'; return; }
    if(!homeroomDataLoaded[studentId]){
      content.innerHTML = '<div class="empty-state"><span class="spinner" style="border-color:rgba(47,69,56,.25); border-top-color:var(--pine);"></span>טוען נתוני תלמיד…</div>';
      ensureStudentHomeroomData(studentId).then(function(){ renderShell(); });
      return;
    }
    var cls = findClass(student.classId);
    var groups = studentGroups(studentId);
    var hd = homeroomData[studentId];

    var backLabel = editable ? '→ חזרה לרשימת התלמידים' : '→ חזרה';
    var domainColsHtml = buildDomainColsHtml(hd, editable);
    var columnsHtml = editable ? domainColsHtml : (buildGroupsColHtml(studentId, groups) + domainColsHtml);
    var photoCircleHtml = hd.photo
      ? '<img src="'+hd.photo+'" style="width:100%; height:100%; object-fit:cover;">'
      : '<span style="font-size:1.6rem; color:var(--ink-soft);">👤</span>';

    content.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6em; margin-bottom:.4em;">' +
        '<button class="back-link" id="backBtn" style="margin:0;">'+backLabel+'</button>' +
        navStudentButtons() +
      '</div>' +
      '<div class="section" style="display:flex; align-items:center; justify-content:space-between; gap:1em; padding:.9em 1.2em; flex-wrap:wrap;">' +
        '<div style="display:flex; align-items:center; gap:1em;">' +
          '<div class="avatar lg">'+esc(initials(student.name))+'</div>' +
          '<div><h2 style="margin-bottom:.1em;">'+esc(student.name)+'</h2><div class="meta" style="color:var(--ink-soft);">כיתת אם: '+esc(cls?cls.name:'—')+'</div></div>' +
        '</div>' +
        (editable ? '<button type="button" class="btn-ghost" id="goPresentationBtn">🎤 תצוגה למליאת המורים</button>' : '') +
      '</div>' +
      (editable ?
        '<div class="section" style="display:flex; align-items:center; gap:1em;">' +
          '<div style="width:80px; height:80px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--paper); display:flex; align-items:center; justify-content:center; border:2px solid var(--border);">'+photoCircleHtml+'</div>' +
          '<div>' +
            '<h3 style="font-size:.9rem; margin-bottom:.5em;">תמונת תלמיד/ה (מוצגת במסך המליאה)</h3>' +
            '<input type="file" accept="image/*" id="photoInput" style="max-width:220px;"> ' +
            (hd.photo ? '<button type="button" class="btn-danger" id="removePhotoBtn" style="margin-top:.5em; padding:.3em .7em; font-size:.78rem;">הסרת תמונה</button>' : '') +
          '</div>' +
        '</div>'
      : '') +
      '<div class="profile-columns">' + columnsHtml + '</div>' +
      '<div class="section"><h2>הערות נוספות</h2>' +
        '<textarea id="notesArea" '+(editable?'':'disabled')+' style="grid-column:auto;">'+esc(hd.notes||'')+'</textarea>' +
        (editable ? '<div style="margin-top:.8em;"><button id="saveNotesBtn" class="btn-primary">שמירת הערות</button></div>' : '') +
      '</div>' +
      (editable ? '<p class="inline-note">שינויים נשמרים מיידית. צבעי המקצועות שנתנו המורים המקצועיים מוצגים במסך "תצוגה למליאת המורים". משמעות הצבעים: סגול=מצטיין, ירוק=טוב, צהוב=טעון שיפור, אדום=לא טוב.</p>' : '');

    document.getElementById('backBtn').addEventListener('click', function(){
      if(view.returnScreen==='homeroom_student_list'){ view = {screen:'homeroom_student_list', classId: view.returnParam}; }
      else if(view.returnScreen==='browse_student_list'){ view = {screen:'browse_student_list', cohortId:view.returnParam.id, cohortType:view.returnParam.type}; }
      else if(view.returnScreen==='browse_pick'){ view = {screen:'browse_pick'}; }
      else { view = defaultViewForRoles(currentUser.roles); }
      render();
    });
    wireNavButtons('student_profile');

    if(editable){
      var goPresBtn = document.getElementById('goPresentationBtn');
      if(goPresBtn){
        goPresBtn.addEventListener('click', function(){
          view = {
            screen:'student_presentation', studentId:studentId, editable:true,
            returnScreen:view.returnScreen, returnParam:view.returnParam,
            cohortStudentIds:view.cohortStudentIds, studentIndex:view.studentIndex
          };
          render();
        });
      }

      var photoInput = document.getElementById('photoInput');
      if(photoInput){
        photoInput.addEventListener('change', async function(){
          var file = photoInput.files && photoInput.files[0];
          if(!file) return;
          showToast('מעבד תמונה…');
          try{
            var dataUrl = await compressImageToDataUrl(file);
            hd.photo = dataUrl;
            showToast('שומר תמונה…');
            var ok = await saveStudentHomeroomData(studentId);
            if(ok) showToast('התמונה נשמרה.');
            renderShell();
          }catch(err){
            console.error(err);
            showToast('שגיאה בעיבוד התמונה. נסו קובץ אחר.');
          }
        });
      }
      var removePhotoBtn = document.getElementById('removePhotoBtn');
      if(removePhotoBtn){
        removePhotoBtn.addEventListener('click', async function(){
          hd.photo = null;
          await saveStudentHomeroomData(studentId);
          showToast('התמונה הוסרה.');
          renderShell();
        });
      }

      content.querySelectorAll('[data-set-ind]').forEach(function(dot){
        dot.addEventListener('click', function(){
          var key = dot.getAttribute('data-ind-key');
          var color = dot.getAttribute('data-color');
          var existing = hd.indicators[key] || {};
          if(existing.color === color){ delete hd.indicators[key]; }
          else{ hd.indicators[key] = {color:color}; }
          renderStudentProfile(content, studentId, editable);
          saveStudentHomeroomData(studentId);
        });
      });

      content.querySelectorAll('[data-toggle-flag]').forEach(function(dot){
        dot.addEventListener('click', function(){
          var key = dot.getAttribute('data-ind-key');
          var existing = hd.indicators[key] || {};
          if(existing.on){ delete hd.indicators[key]; }
          else{ hd.indicators[key] = {on:true}; }
          renderStudentProfile(content, studentId, editable);
          saveStudentHomeroomData(studentId);
        });
      });

      content.querySelectorAll('[data-set-letter]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var key = btn.getAttribute('data-ind-key');
          var letter = btn.getAttribute('data-letter');
          var existing = hd.indicators[key] || {};
          if(existing.value === letter){ delete hd.indicators[key]; }
          else{ hd.indicators[key] = {value:letter}; }
          renderStudentProfile(content, studentId, editable);
          saveStudentHomeroomData(studentId);
        });
      });

      content.querySelectorAll('[data-select-ind]').forEach(function(sel){
        sel.addEventListener('change', function(){
          var key = sel.getAttribute('data-ind-key');
          if(sel.value){ hd.indicators[key] = {value:sel.value}; }
          else{ delete hd.indicators[key]; }
          renderStudentProfile(content, studentId, editable);
          saveStudentHomeroomData(studentId);
        });
      });

      content.querySelectorAll('[data-count-input]').forEach(function(inp){
        inp.addEventListener('change', function(){
          var key = inp.getAttribute('data-ind-key');
          var n = parseInt(inp.value||'0',10) || 0;
          hd.indicators[key] = {count:n, color:countColor(n)};
          renderStudentProfile(content, studentId, editable);
          saveStudentHomeroomData(studentId);
        });
      });

      document.getElementById('saveNotesBtn').addEventListener('click', async function(){
        hd.notes = document.getElementById('notesArea').value;
        showToast('שומר...');
        await saveStudentHomeroomData(studentId);
        showToast('ההערות נשמרו.');
      });
    }
  }

  // The "presentation to the faculty meeting" screen: a single formatted, read-only view of
  // everything known about one student (photo + subject-color badges + all homeroom indicators as
  // icon badges + notes), with the same prev/next paging as the data-entry screen. The student's
  // name is kept to a small header strip so the indicator badges get most of the space.
  // Adjusts the presentation's icon grid up or down (as one block, via CSS zoom - see the .mliya-
  // page comment in the <style> section above for why zoom and not transform:scale) so it always
  // fills the available screen exactly, edge to edge, whatever the student's actual amount of data
  // is (few groups and no note vs. many groups and a long note) - instead of a fixed icon size that
  // would overflow into a scrollbar for a busy student and waste the screen for a light one.
  // Since zoom changes real layout (unlike transform), there's no formula that predicts the right
  // level directly - shrinking it can let another icon or two fit per row, changing the shape of
  // the whole block - so this searches for the largest zoom level (up to a comfortable cap) that
  // still fits, by trying levels and measuring the actual result each time.
  var mliyaFitResizeWired = false;
  function fitMliyaPage(){
    var wrap = document.querySelector('.mliya-page .mliya-fit-wrap');
    var cols = wrap && wrap.querySelector('.profile-columns');
    if(!wrap || !cols) return;
    var availW = wrap.clientWidth, availH = wrap.clientHeight;
    if(availW<=0 || availH<=0) return;
    var MIN_ZOOM = 0.5, MAX_ZOOM = 1.6; // cap shrinking (readability) and enlarging (comically huge)
    function fitsAt(z){
      cols.style.zoom = z;
      return cols.scrollWidth<=availW && cols.scrollHeight<=availH;
    }
    var best = MIN_ZOOM;
    if(fitsAt(MAX_ZOOM)){
      best = MAX_ZOOM; // very little data - use the biggest comfortable icons
    } else if(!fitsAt(MIN_ZOOM)){
      best = MIN_ZOOM; // a lot of data - use the smallest icons and let the fallback scrollbar handle the rest
    } else {
      var lo = MIN_ZOOM, hi = MAX_ZOOM;
      for(var i=0;i<14;i++){
        var mid = (lo+hi)/2;
        if(fitsAt(mid)){ best = mid; lo = mid; } else { hi = mid; }
      }
    }
    cols.style.zoom = best;
  }
  if(!mliyaFitResizeWired){
    mliyaFitResizeWired = true;
    window.addEventListener('resize', function(){
      if(document.querySelector('.mliya-page')) fitMliyaPage();
    });
  }
  function renderStudentPresentation(content, studentId){
    var student = findStudent(studentId);
    if(!student){ content.innerHTML = '<div class="empty-state">התלמיד לא נמצא.</div>'; return; }
    if(!homeroomDataLoaded[studentId]){
      content.innerHTML = '<div class="empty-state"><span class="spinner" style="border-color:rgba(47,69,56,.25); border-top-color:var(--pine);"></span>טוען נתוני תלמיד…</div>';
      ensureStudentHomeroomData(studentId).then(function(){ renderShell(); });
      return;
    }
    var cls = findClass(student.classId);
    var groups = studentGroups(studentId);
    var hd = homeroomData[studentId];
    var cameFromEntry = !!view.editable;

    var columnsHtml = buildGroupsColHtml(studentId, groups) + buildDomainColsHtmlPresentation(hd);
    var avatarHtml = hd.photo
      ? '<img src="'+hd.photo+'" style="width:64px; height:64px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid var(--brass);">'
      : '<div class="avatar" style="flex-shrink:0; width:64px; height:64px; font-size:1.6rem;">'+esc(initials(student.name))+'</div>';
    // Small identity strip (photo shrunk down + name) so most of the header row's width is
    // freed up for the teacher-notes box, and the rest of the screen for bigger icons.
    var identityHtml =
      '<div style="display:flex; align-items:center; gap:.6em; flex-shrink:0;">' +
        avatarHtml +
        '<div><h2 style="margin:0; font-size:.92rem;">'+esc(student.name)+'</h2><div class="meta" style="font-size:.68rem;">כיתת אם: '+esc(cls?cls.name:'—')+'</div></div>' +
      '</div>';
    var notesHtml = hd.notes
      ? '<div style="flex:1; min-width:0; max-height:100%; overflow:auto; background:var(--paper); border-radius:10px; padding:.4em .8em;">' +
          '<div style="font-weight:700; font-size:.68rem; color:var(--ink-soft); margin-bottom:.15em;">הערות המורה</div>' +
          '<p style="white-space:pre-wrap; font-size:.76rem; margin:0; line-height:1.3;">'+esc(hd.notes)+'</p>' +
        '</div>'
      : '<div style="flex:1;"></div>';

    content.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6em; margin-bottom:.4em;">' +
        '<button class="back-link" id="backBtn" style="margin:0;">'+(cameFromEntry ? '→ חזרה לאזור הזנת הנתונים' : '→ חזרה')+'</button>' +
        navStudentButtons() +
      '</div>' +
      '<div class="mliya-page">' +
        '<div class="section" style="display:flex; align-items:center; gap:1em; padding:.4em .9em; border-top:4px solid var(--brass); flex-shrink:0;">' +
          identityHtml +
          notesHtml +
        '</div>' +
        '<div class="mliya-fit-wrap"><div class="profile-columns">' + columnsHtml + '</div></div>' +
      '</div>' +
      '<div class="rotate-prompt"><div class="icon">🔄📱</div><h2>מסך זה מיועד לתצוגה לרוחב</h2><p>סובבו את הטלפון לרוחב כדי לצפות ב"תצוגה למליאת המורים".</p></div>';

    fitMliyaPage();

    document.getElementById('backBtn').addEventListener('click', function(){
      if(cameFromEntry){
        view = {
          screen:'student_profile', studentId:studentId, editable:true,
          returnScreen:view.returnScreen, returnParam:view.returnParam,
          cohortStudentIds:view.cohortStudentIds, studentIndex:view.studentIndex
        };
      }else if(view.returnScreen==='homeroom_student_list'){ view = {screen:'homeroom_student_list', classId: view.returnParam}; }
      else if(view.returnScreen==='browse_student_list'){ view = {screen:'browse_student_list', cohortId:view.returnParam.id, cohortType:view.returnParam.type}; }
      else if(view.returnScreen==='browse_pick'){ view = {screen:'browse_pick'}; }
      else { view = defaultViewForRoles(currentUser.roles); }
      render();
    });
    wireNavButtons('student_presentation');
  }

  function renderIndicatorRow(rawKey, item, rec, editable){
    var key = esc(rawKey); // HTML-escaped for safe use inside a "..." attribute (labels can contain a literal " character, e.g. הכנות לצה"ל)
    var body;
    if(item.kind==='number'){
      var count = rec.count || 0;
      var color = countColor(count);
      body = '<div style="display:flex; align-items:center; gap:.7em;">' +
        (editable ? '<input type="number" min="0" style="width:70px;" data-count-input data-ind-key="'+key+'" value="'+count+'">' : '<span class="meta">'+count+'</span>') +
        '<div class="color-dot '+COLOR_CLASS[color]+'" title="'+colorTitle(color)+' (אוטומטי לפי כמות)"></div>' +
      '</div>';
    }else if(item.kind==='flag'){
      var on = !!rec.on;
      if(editable){
        body = '<div class="color-dot '+(on?'c-green selected':'empty')+'" data-toggle-flag data-ind-key="'+key+'" title="'+(on?'מסומן':'לא מסומן — לחצו לסמן')+'"></div>';
      }else{
        body = '<div class="color-dot '+(on?'c-green':'empty')+'" title="'+(on?'מסומן':'לא מסומן')+'"></div>';
      }
    }else if(item.kind==='select'){
      if(editable){
        body = '<select data-select-ind data-ind-key="'+key+'" style="max-width:260px;">' +
          '<option value="">— לא צוין —</option>' +
          item.options.map(function(o){ return '<option value="'+esc(o.value)+'" '+(rec.value===o.value?'selected':'')+'>'+o.icon+' '+esc(o.value)+'</option>'; }).join('') +
        '</select>';
      }else{
        var selOpt = item.options.find(function(o){ return o.value===rec.value; });
        body = '<span class="meta">'+(selOpt ? selOpt.icon+' '+esc(selOpt.value) : '— לא צוין —')+'</span>';
      }
    }else if(item.kind==='letter'){
      body = '<div class="color-picker">' + item.letters.map(function(L){
        var sel = rec.value===L ? ' selected' : '';
        if(editable){
          return '<div class="color-dot empty'+sel+'" data-set-letter data-ind-key="'+key+'" data-letter="'+L+'" style="font-weight:800; color:var(--ink);">'+L+'</div>';
        }
        return rec.value===L ? '<div class="color-dot empty selected" style="font-weight:800; color:var(--ink);">'+L+'</div>' : '';
      }).join('') + (!editable && !rec.value ? '<span class="meta">— לא צוין —</span>' : '') + '</div>';
    }else{ // 'color'
      var current = rec.color;
      if(editable){
        body = '<div class="color-picker">' + item.colors.map(function(c){
          var sel = current===c ? ' selected' : '';
          return '<div class="color-dot '+COLOR_CLASS[c]+sel+'" data-set-ind data-ind-key="'+key+'" data-color="'+c+'" title="'+colorTitle(c)+'"></div>';
        }).join('') + '</div>';
      }else{
        body = '<div class="color-picker"><div class="color-dot '+(current?COLOR_CLASS[current]:'empty')+'" title="'+colorTitle(current)+'"></div></div>';
      }
    }
    var iconHtml = renderItemIcon(item, rec, 42);
    return '<div class="compact-row"><span class="clabel" title="'+esc(item.label)+'" style="display:inline-flex; align-items:center; justify-content:center;">'+iconHtml+'</span>'+body+'</div>';
  }

  /* ===================== Boot ===================== */
  render();

})();
</script>
